# Settings for the parity_set test group.

export PARITY_DIR=${TEST_BASE_DIR%%/}/parity_set
export PARITY_VDEV=$PARITY_DIR/vdev0
export PARITY_VDEV2=$PARITY_DIR/vdev1
export PARITY_VDEV_SIZE=512M

# Tests of members with several top-level vdevs use separate paths,
# because the test runner may run them at the same time as the other
# parity_set cases.
export PARITY_COLS_DIR=${TEST_BASE_DIR%%/}/parity_cols_${TESTPOOL}
export PARITY_COLS_VDEV0=$PARITY_COLS_DIR/vdev0
export PARITY_COLS_VDEV1=$PARITY_COLS_DIR/vdev1
export PARITY_COLS_VDEV2=$PARITY_COLS_DIR/vdev2
export PARITY_COLS_VDEV3=$PARITY_COLS_DIR/vdev3

# Size of the data that a test writes, in MiB.
export PARITY_DATA_MB=96

# A small record limit, in bytes, for the throttle tests.
# One entry is 144 bytes, one per block: 96 MiB in 128K records is about 110 KiB.
export PARITY_SMALL_LIMIT=$(( 64 * 1024 ))

# Default values of the tunables that a test may change.
export PARITY_VERIFY_DEFAULT=0
export PARITY_TEST_INJECT_DEFAULT=0
export PARITY_TEST_AUTO_APPLY_DEFAULT=0
export PARITY_SUSPEND_RELEASE_DEFAULT=0
export PARITY_RELEASE_LIMIT_DEFAULT=65536
export PARITY_REPAIR_WAIT_MS_DEFAULT=30000
export PARITY_ALLOW_EXPAND_DEFAULT=0
export PARITY_IMPORT_OVERRIDE_DEFAULT=0
export PARITY_PACE_IDLE_MS_DEFAULT=10000
